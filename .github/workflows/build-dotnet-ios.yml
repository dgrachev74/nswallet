name: Build .NET 8 iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Install Required Workloads
      run: dotnet workload install ios wasm-tools-net8
      
    - name: Restore NuGet Packages
      run: dotnet restore ./src/NSWallet/iOS/NSWallet.iOS.csproj

    - name: Publish iOS App (Unsigned IPA)
      run: |
        dotnet publish ./src/NSWallet/iOS/NSWallet.iOS.csproj \
          -c Release \
          -f net8.0-ios \
          -p:ArchiveOnBuild=true \
          -p:BuildIpa=true \
          -p:CodesignRequire=false \
          -p:CodesignKey="" \
          -p:CodesignProvision="" \
          -o $RUNNER_TEMP/output

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nswallet-net8-ipa
        path: ${{ runner.temp }}/output/*.ipa
