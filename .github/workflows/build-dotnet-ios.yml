name: Build .NET iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15 # Cloud macOS runner

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Adjust to match project version (e.g., 7.0, 8.0, 9.0)

    - name: Install iOS Workloads
      run: dotnet workload install ios
      
    #- name: List workspace contents
    #  run: ls -R
      
    - name: Restore dependencies
      run: dotnet restore ./src/NSWallet/NSWallet.sln # Replace with your .sln file name

    - name: Build and Package Unsigned IPA
      run: |
        dotnet publish ./src/NSWallet/iOS/NSWallet.iOS.csproj \
          -c Release \
          -f net8.0-ios \
          -p:ArchiveOnBuild=true \
          -p:BuildIpa=true \
          -p:CodesignRequire=false \
          -p:CodesignKey="" \
          -p:CodesignProvision="" \
          -o $RUNNER_TEMP/output

    - name: Locate and Package IPA File
      run: |
        mkdir -p $RUNNER_TEMP/ipa_out
        find $RUNNER_TEMP/output -name "*.ipa" -exec cp {} $RUNNER_TEMP/ipa_out/ \; || true
        # Fallback zip packaging if raw bin app folder was generated
        if [ -z "$(ls -A $RUNNER_TEMP/ipa_out)" ]; then
          mkdir -p $RUNNER_TEMP/Payload
          cp -R $RUNNER_TEMP/output/*.app $RUNNER_TEMP/Payload/ 2>/dev/null || true
          cd $RUNNER_TEMP && zip -r ipa_out/unsigned-app.ipa Payload
        fi

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-visual-studio-ipa
        path: ${{ runner.temp }}/ipa_out/*.ipa
