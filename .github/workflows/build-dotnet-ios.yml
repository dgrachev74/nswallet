name: Build .NET 10 iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'  # Match .NET 10
    
    - name: Select Xcode Version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '27.2' # Matches the exact version your .NET iOS workload expects
        
    - name: Install Required Workloads
      run: dotnet workload install ios

    - name: Restore NuGet Packages
      run: dotnet restore ./src/NSWallet/iOS/NSWallet.iOS.csproj

    - name: Publish iOS App (Unsigned IPA)
      run: |
        dotnet publish ./src/NSWallet/iOS/NSWallet.iOS.csproj \
          -c Release \
          -f net10.0-ios \
          -p:ArchiveOnBuild=true \
          -p:BuildIpa=true \
          -p:CodesignRequire=false \
          -p:CodesignKey="" \
          -p:CodesignProvision="" \
          -o $RUNNER_TEMP/output

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nswallet-net10-ipa
        path: ${{ runner.temp }}/output/*.ipa
